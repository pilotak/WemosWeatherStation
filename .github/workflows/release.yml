name: release

on:
  push:
    tags:
      - "v*"

defaults:
  run:
    working-directory: ./code

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history and tags for the changelog

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('code/platformio.ini') }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build
        run: |
          pio run -e WemosWeatherStation_v2 -e WemosWeatherStation_v2_upgrade -e WemosWeatherStation_v2_bmp280

      - name: Create release
        run: |
          set -x
          assets=()

          for path in ./.pio/build/*/; do
            name="$(basename "${path}")"
            mv "./.pio/build/$name/firmware.bin" "$name.bin"
            assets+=("$name.bin")
          done

          echo "## :bookmark_tabs: Changes" >"CHANGELOG.md"
          git log --pretty=format:"- %s %H%n" "$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^")..${GITHUB_REF_NAME}" >>"CHANGELOG.md"

          gh release create "${GITHUB_REF_NAME}" "${assets[@]}" --title "FW ${GITHUB_REF_NAME#v}" --notes-file "CHANGELOG.md"
        env:
          GH_TOKEN: ${{ github.token }}
