[platformio]
default_envs = WemosWeatherStation_v2
src_dir = WemosWeatherStation

[common]
platform = espressif8266@^4.2.1
build_flags =
  '-D DEBUG'
  '-D HTTP_OTA'
  '-D ARDUINO_OTA' 
  '-D WM_ADC_RESOLUTION=1024'
  '-D WIFI_MANAGER_MAX_PARAMS=6'
lib_deps =
  Wire
  SPI
  bblanchon/ArduinoJson @ ^6.18.0
  https://github.com/tzapu/WiFiManager.git
  marvinroger/AsyncMqttClient
  jchristensen/JC_Button
  pilotak/MovingAverageFloat
  pilotak/MeteoFunctions
  pilotak/MovingAverage

[bme280]
lib_deps =
  https://github.com/finitespace/BME280.git#72a11d3b7d484995eb34c6bb8533c5ceb2aa4156

[env:WemosWeatherStation]
platform = ${common.platform}
board = d1_mini
framework = arduino
build_flags =
  ${common.build_flags}
  '-D SENSOR_MCP9808'
  '-D SENSOR_BMP280'
  '-D SENSOR_HTU21D'
  '-D HAS_METERS'
lib_deps =
  ${common.lib_deps}
  adafruit/Adafruit MCP9808 Library
  ${bme280.lib_deps}
  enjoyneering/HTU21D
  pilotak/WeatherMeters
  pilotak/MCP3X21

[env:WemosWeatherStation_no_meters]
platform = ${common.platform}
board = d1_mini
framework = arduino
build_flags =
  ${common.build_flags}
  '-D SENSOR_MCP9808'
  '-D SENSOR_BMP280'
  '-D SENSOR_HTU21D'
lib_deps =
  ${common.lib_deps}
  adafruit/Adafruit MCP9808 Library
  ${bme280.lib_deps}
  enjoyneering/HTU21D

[env:WemosWeatherStation_v2]
platform = ${common.platform}
board = d1_mini
framework = arduino
build_flags =
  ${common.build_flags}
  '-D SENSOR_LPS35HW'
  '-D SENSOR_SHT31'
  '-D HAS_METERS'
lib_deps =
  ${common.lib_deps}
  pilotak/LPS35HW
  https://github.com/pilotak/ClosedCube_SHT31D_Arduino
  pilotak/WeatherMeters
  pilotak/MCP3X21

[env:WemosWeatherStation_v2_upgrade]
platform = ${common.platform}
board = d1_mini
framework = arduino
build_flags =
  ${common.build_flags}
  '-D SENSOR_MCP9808'
  '-D SENSOR_LPS35HW'
  '-D SENSOR_SHT31'
  '-D HAS_METERS'
lib_deps =
  ${common.lib_deps}
  pilotak/LPS35HW
  https://github.com/pilotak/ClosedCube_SHT31D_Arduino
  adafruit/Adafruit MCP9808 Library
  pilotak/WeatherMeters
  pilotak/MCP3X21


[env:WemosWeatherStation_v2_bmp280]
platform = ${common.platform}
board = d1_mini
framework = arduino
build_flags =
  ${common.build_flags}
  '-D SENSOR_BMP280'
  '-D SENSOR_SHT31'
  '-D HAS_METERS'
lib_deps =
  ${common.lib_deps}
  ${bme280.lib_deps}
  https://github.com/pilotak/ClosedCube_SHT31D_Arduino
  pilotak/WeatherMeters
  pilotak/MCP3X21
